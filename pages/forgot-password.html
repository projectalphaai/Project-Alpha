<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, follow">
    <title>Forgot password — Project Alpha AI</title>
    <link rel="icon" type="image/svg+xml" href="../img/favicon.svg">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/auth.css">
</head>
<body class="auth-body">
    <div class="aurora-bg" aria-hidden="true">
        <div class="aurora aurora-1"></div>
        <div class="aurora aurora-2"></div>
    </div>
    <main class="auth-main">
        <div class="auth-card glass-panel">
            <h1>Reset password</h1>
            <p class="auth-lead">Enter your account email. We’ll send a reset link if it exists.</p>
            <form class="auth-form" id="forgot-form" novalidate>
                <label for="forgot-email">Email</label>
                <input type="email" id="forgot-email" required autocomplete="email" placeholder="you@company.com">
                <div class="auth-form-error" id="forgot-error" hidden role="alert"></div>
                <div class="form-success" id="forgot-success" hidden role="status"></div>
                <button type="submit" class="btn btn-glow" id="forgot-submit">
                    <span class="btn-label">Send reset link</span>
                    <span class="btn-spinner" hidden aria-hidden="true"></span>
                </button>
            </form>
            <p class="auth-switch"><a href="./login.html">Back to log in</a></p>
        </div>
    </main>
    <script src="../js/config.js" defer></script>
    <script src="../js/api.js" defer></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const form = document.getElementById("forgot-form");
        form.addEventListener("submit", async (e) => {
          e.preventDefault();
          const err = document.getElementById("forgot-error");
          const ok = document.getElementById("forgot-success");
          const btn = document.getElementById("forgot-submit");
          err.hidden = true;
          ok.hidden = true;
          btn.disabled = true;
          try {
            const data = await AlphaAPI.api("/api/auth/forgot-password", {
              method: "POST",
              body: { email: document.getElementById("forgot-email").value.trim() }
            });
            ok.hidden = false;
            ok.textContent = data.message || "If that email exists, a reset link was sent.";
          } catch (ex) {
            err.hidden = false;
            err.textContent = ex.message || "Could not send reset email.";
          } finally {
            btn.disabled = false;
          }
        });
      });
    </script>
</body>
</html>
