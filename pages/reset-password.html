<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, follow">
    <title>Set new password — Project Alpha AI</title>
    <link rel="icon" type="image/svg+xml" href="../img/favicon.svg">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/auth.css">
</head>
<body class="auth-body">
    <div class="aurora-bg" aria-hidden="true">
        <div class="aurora aurora-1"></div>
        <div class="aurora aurora-2"></div>
    </div>
    <main class="auth-main">
        <div class="auth-card glass-panel">
            <h1>Choose a new password</h1>
            <p class="auth-lead">Enter a password with at least 8 characters.</p>
            <form class="auth-form" id="reset-form" novalidate>
                <label for="reset-password">New password</label>
                <input type="password" id="reset-password" required minlength="8" autocomplete="new-password">
                <label for="reset-confirm">Confirm password</label>
                <input type="password" id="reset-confirm" required minlength="8" autocomplete="new-password">
                <div class="auth-form-error" id="reset-error" hidden role="alert"></div>
                <button type="submit" class="btn btn-glow" id="reset-submit">
                    <span class="btn-label">Update password</span>
                    <span class="btn-spinner" hidden aria-hidden="true"></span>
                </button>
            </form>
        </div>
    </main>
    <script src="../js/config.js" defer></script>
    <script src="../js/api.js" defer></script>
    <script src="../js/auth.js" defer></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const token = new URLSearchParams(window.location.search).get("token");
        const form = document.getElementById("reset-form");
        const err = document.getElementById("reset-error");
        if (!token) {
          err.hidden = false;
          err.textContent = "Missing reset token. Request a new link.";
          form.querySelector("button").disabled = true;
          return;
        }
        form.addEventListener("submit", async (e) => {
          e.preventDefault();
          err.hidden = true;
          const password = document.getElementById("reset-password").value;
          const confirm = document.getElementById("reset-confirm").value;
          if (password.length < 8) {
            err.hidden = false;
            err.textContent = "Password must be at least 8 characters.";
            return;
          }
          if (password !== confirm) {
            err.hidden = false;
            err.textContent = "Passwords do not match.";
            return;
          }
          try {
            const data = await AlphaAPI.api("/api/auth/reset-password", {
              method: "POST",
              body: { token, password }
            });
            if (data.user) AlphaAuth.cacheUser?.(data.user);
            const next = data.user?.onboardingComplete ? "./dashboard.html" : "./onboarding.html";
            window.location.href = next;
          } catch (ex) {
            err.hidden = false;
            err.textContent = ex.message || "Reset failed.";
          }
        });
      });
    </script>
</body>
</html>
