<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Create your Project Alpha AI account — start scheduling, CRM, and AI automation.">
    <meta name="robots" content="noindex, follow">
    <meta name="theme-color" content="#030712">
    <title>Sign Up — Project Alpha AI</title>
    <link rel="icon" type="image/svg+xml" href="../img/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"></noscript>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/auth.css">
</head>
<body class="auth-body">
    <a href="#signup-form" class="skip-link">Skip to signup form</a>
    <div class="aurora-bg" aria-hidden="true">
        <div class="aurora aurora-1"></div>
        <div class="aurora aurora-2"></div>
        <div class="aurora aurora-3"></div>
    </div>

    <header class="site-header auth-navbar" role="banner">
        <nav class="navbar" aria-label="Auth navigation">
            <a href="../index.html" class="logo" aria-label="Project Alpha AI Home">
                <svg class="logo-icon" viewBox="0 0 32 32" aria-hidden="true">
                    <defs>
                        <linearGradient id="signupLogoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#3b82f6"/>
                            <stop offset="100%" stop-color="#8b5cf6"/>
                        </linearGradient>
                    </defs>
                    <circle cx="16" cy="16" r="14" fill="url(#signupLogoGrad)" opacity="0.2"/>
                    <circle cx="16" cy="16" r="4" fill="url(#signupLogoGrad)"/>
                </svg>
                <span><span class="ai-logo-gradient">Project Alpha</span> AI</span>
            </a>
            <ul class="nav-links">
                <li><a href="../index.html">Home</a></li>
                <li><a href="./login.html" class="btn btn-outline-glow btn-sm">Log In</a></li>
            </ul>
        </nav>
    </header>

    <main class="auth-main">
        <div class="auth-card glass-panel">
            <h1>Create your account</h1>
            <p class="auth-lead">Start your free trial of Project Alpha AI.</p>

            <form class="auth-form" id="signup-form" novalidate>
                <label for="signup-name">Full name</label>
                <input type="text" id="signup-name" name="name" autocomplete="name" required minlength="2" placeholder="Alex Rivera" aria-describedby="signup-name-error">
                <span class="field-error" id="signup-name-error" role="alert"></span>

                <label for="signup-email">Email</label>
                <input type="email" id="signup-email" name="email" autocomplete="email" required placeholder="you@company.com" aria-describedby="signup-email-error">
                <span class="field-error" id="signup-email-error" role="alert"></span>

                <label for="signup-password">Password</label>
                <input type="password" id="signup-password" name="password" autocomplete="new-password" required minlength="8" placeholder="At least 8 characters" aria-describedby="signup-password-error">
                <span class="field-error" id="signup-password-error" role="alert"></span>

                <label for="signup-confirm">Confirm password</label>
                <input type="password" id="signup-confirm" name="confirm" autocomplete="new-password" required minlength="8" placeholder="Repeat password" aria-describedby="signup-confirm-error">
                <span class="field-error" id="signup-confirm-error" role="alert"></span>

                <div class="auth-form-error" id="signup-form-error" hidden role="alert"></div>

                <button type="submit" class="btn btn-glow" id="signup-submit">
                    <span class="btn-label">Create Account</span>
                    <span class="btn-spinner" hidden aria-hidden="true"></span>
                </button>
            </form>

            <p class="auth-switch">Already have an account? <a href="./login.html">Log in</a></p>
            <p class="auth-demo-hint">Demo only: accounts are saved in localStorage on this device. No real email is sent.</p>
        </div>
    </main>

    <script src="../js/auth.js" defer></script>
    <script src="../js/auth-pages.js" defer></script>
</body>
</html>
